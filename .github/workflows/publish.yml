name: Publish to npm

# A `<package>@<version>` tag publishes packages/<package>.
on:
    push:
        tags: ['*@*']
    workflow_dispatch:
        inputs:
            package:
                description: Directory under packages/
                required: true
                type: string

concurrency:
    group: publish-${{ inputs.package || github.ref }}
    cancel-in-progress: false

permissions:
    id-token: write
    contents: read

env:
    # Only until every package has a trusted publisher on npm.
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # Version comes from "packageManager" in package.json.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Resolve the package and check the tag against its version
              id: target
              env:
                  PACKAGE: ${{ inputs.package }}
              run: |
                  if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                    dir="$PACKAGE"
                  else
                    dir="${GITHUB_REF_NAME%@*}"
                    tag="${GITHUB_REF_NAME##*@}"
                  fi

                  manifest="packages/$dir/package.json"
                  if [ ! -f "$manifest" ]; then
                    echo "no package at packages/$dir" >&2
                    exit 1
                  fi

                  name="$(node -p "require('./$manifest').name")"
                  version="$(node -p "require('./$manifest').version")"
                  if [ -n "${tag:-}" ] && [ "$tag" != "$version" ]; then
                    echo "tag $GITHUB_REF_NAME does not match $name@$version" >&2
                    exit 1
                  fi

                  echo "dir=packages/$dir" >> "$GITHUB_OUTPUT"
                  if npm view "$name@$version" version >/dev/null 2>&1; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                    echo "$name@$version is already on npm, nothing to do"
                  else
                    echo "releasing $name@$version"
                  fi

            # The whole suite: create-jaad is tested through jaad, jaad through
            # the site, and every package through its packed tarball.
            - name: Check and test
              if: steps.target.outputs.published != 'true'
              run: |
                  pnpm check
                  pnpm test
                  pnpm test:build
                  pnpm test:consumer

            - name: Authenticate with a token
              if: steps.target.outputs.published != 'true' && env.NPM_TOKEN != ''
              run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

            # pnpm writes the versions behind `workspace:` ranges into the tarball.
            - name: Publish
              if: steps.target.outputs.published != 'true'
              working-directory: ${{ steps.target.outputs.dir }}
              run: pnpm publish --provenance --access public --no-git-checks
