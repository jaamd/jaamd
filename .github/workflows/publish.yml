name: Publish to npm

# A `v<version>` tag publishes every package at that version. Running it by hand
# on the tag publishes what is missing, e.g. after a failed run.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

concurrency:
    group: publish
    cancel-in-progress: false

permissions: {}

env:
    # Dependencies first: each tarball names the version of the one before.
    PACKAGES: core astro site jaad create-jaad

jobs:
    # Installs, tests and packs with no secrets and no publishing rights: the
    # dependencies' install scripts and the test suite run here.
    verify:
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            version: ${{ steps.release.outputs.version }}
            dist-tag: ${{ steps.release.outputs.dist-tag }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Version comes from "packageManager" in package.json.
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            # No dependency cache: a release builds from the registry alone.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'

            - run: pnpm install --frozen-lockfile

            - name: Check the version against the tag and every package
              id: release
              run: |
                  for manifest in packages/*/package.json; do
                    dir="$(basename "$(dirname "$manifest")")"
                    case " $PACKAGES " in
                      *" $dir "*) ;;
                      *) echo "packages/$dir is missing from PACKAGES" >&2; exit 1 ;;
                    esac
                  done

                  version="$(node -p "require('./packages/core/package.json').version")"
                  for dir in $PACKAGES; do
                    own="$(node -p "require('./packages/$dir/package.json').version")"
                    if [ "$own" != "$version" ]; then
                      echo "packages/$dir is $own, not $version" >&2
                      exit 1
                    fi
                  done
                  if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                    echo "tag $GITHUB_REF_NAME does not match version $version" >&2
                    exit 1
                  fi

                  # A prerelease must not become what `npm install` picks.
                  case "$version" in
                    *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
                    *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
                  esac
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            # The whole suite: create-jaad is tested through jaad, jaad through
            # the site, and core, astro and jaad through their packed tarballs.
            - name: Check and test
              run: |
                  pnpm check
                  pnpm test
                  pnpm test:build
                  pnpm test:consumer

            # pnpm writes the versions behind `workspace:` ranges into the tarball.
            - name: Pack
              run: |
                  mkdir -p "$RUNNER_TEMP/tarballs"
                  for dir in $PACKAGES; do
                    (cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
                  done

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: tarballs
                  path: ${{ runner.temp }}/tarballs/*.tgz
                  if-no-files-found: error
                  retention-days: 7

    # Publishes the tested tarballs. Nothing is installed or built here, so no
    # third-party code runs next to the publishing rights.
    publish:
        needs: verify
        runs-on: ubuntu-latest
        # Its protection rules (reviewers, tag pattern) live in the repository settings.
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: tarballs
                  path: ${{ runner.temp }}/tarballs

            # npm publishes through each package's trusted publisher, with the
            # job's OIDC token: there is no npm token. A package already on npm at
            # this version is skipped, so a rerun finishes what a failed one left.
            - name: Publish
              env:
                  VERSION: ${{ needs.verify.outputs.version }}
                  DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
              run: |
                  # Trusted publishing needs npm 11.5.1 or later.
                  if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
                    echo "npm $(npm --version) cannot publish through a trusted publisher" >&2
                    exit 1
                  fi

                  for dir in $PACKAGES; do
                    name="$(node -p "require('./packages/$dir/package.json').name")"
                    if npm view "$name@$VERSION" version >/dev/null 2>&1; then
                      echo "$name@$VERSION is already on npm"
                      continue
                    fi

                    # pnpm names a tarball after the package, scope included: @jaamd/core → jaamd-core-<version>.tgz
                    tarball="$RUNNER_TEMP/tarballs/$(echo "${name#@}" | tr / -)-$VERSION.tgz"
                    echo "publishing $name@$VERSION as $DIST_TAG"
                    npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
                  done
