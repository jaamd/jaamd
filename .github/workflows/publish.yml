name: Publish to npm

# A `v<version>` tag publishes every package at that version.
on:
    push:
        tags: ['v*']
    # Publishes what is missing at the version of the chosen ref, e.g. after a failed run.
    workflow_dispatch:

concurrency:
    group: publish
    cancel-in-progress: false

permissions:
    id-token: write
    contents: read

env:
    # Only until every package has a trusted publisher on npm.
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    # Dependencies first: each tarball names the version of the one before.
    PACKAGES: core astro jaad create-jaad

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # Version comes from "packageManager" in package.json.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Check the version against the tag and every package
              id: release
              run: |
                  for manifest in packages/*/package.json; do
                    dir="$(basename "$(dirname "$manifest")")"
                    case " $PACKAGES " in
                      *" $dir "*) ;;
                      *) echo "packages/$dir is missing from PACKAGES" >&2; exit 1 ;;
                    esac
                  done

                  version="$(node -p "require('./packages/core/package.json').version")"
                  for dir in $PACKAGES; do
                    own="$(node -p "require('./packages/$dir/package.json').version")"
                    if [ "$own" != "$version" ]; then
                      echo "packages/$dir is $own, not $version" >&2
                      exit 1
                    fi
                  done
                  if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
                    echo "tag $GITHUB_REF_NAME does not match version $version" >&2
                    exit 1
                  fi

                  # A prerelease must not become what `npm install` picks.
                  case "$version" in
                    *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
                    *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
                  esac
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            # The whole suite: create-jaad is tested through jaad, jaad through
            # the site, and every package through its packed tarball.
            - name: Check and test
              run: |
                  pnpm check
                  pnpm test
                  pnpm test:build
                  pnpm test:consumer

            - name: Authenticate with a token
              if: env.NPM_TOKEN != ''
              run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

            # pnpm writes the versions behind `workspace:` ranges into the tarball.
            # A package already on npm at this version is skipped, so a rerun
            # finishes what a failed one left.
            - name: Publish
              env:
                  VERSION: ${{ steps.release.outputs.version }}
                  DIST_TAG: ${{ steps.release.outputs.dist-tag }}
              run: |
                  for dir in $PACKAGES; do
                    name="$(node -p "require('./packages/$dir/package.json').name")"
                    if npm view "$name@$VERSION" version >/dev/null 2>&1; then
                      echo "$name@$VERSION is already on npm"
                      continue
                    fi
                    echo "publishing $name@$VERSION as $DIST_TAG"
                    (cd "packages/$dir" && pnpm publish --provenance --access public --no-git-checks --tag "$DIST_TAG")
                  done
