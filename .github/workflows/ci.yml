name: CI

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

# A newer push to a pull request replaces its run; every commit on main keeps its own.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    static:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm
            # Formatting and linting read sources only: nothing needs building.
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm format:check
            - run: pnpm lint

    # On a pull request that touches only packages/ and site/, runs the changed
    # projects and their dependents. Anything else runs every project, and so does
    # a change to a fixture: it is a project of its own, built by its package's tests.
    packages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Select projects
              id: scope
              run: |
                  [ "$GITHUB_EVENT_NAME" = pull_request ] || exit 0

                  changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
                  if echo "$changed" | grep -qvE '^(packages|site)/' ||
                     echo "$changed" | grep -qE '^packages/[^/]+/tests/fixture/'; then
                    exit 0
                  fi

                  filter="--filter=...[origin/$GITHUB_BASE_REF]"
                  # The site checks its palette against JAAD's stylesheet.
                  if echo "$changed" | grep -qE '^packages/jaad/src/site/styles/'; then
                    filter="$filter --filter=site"
                  fi
                  echo "filter=$filter" >> "$GITHUB_OUTPUT"

            # The filter goes through the environment: a step output never becomes shell source.
            - run: pnpm -r $FILTER --if-present run check
              env:
                  FILTER: ${{ steps.scope.outputs.filter }}
            - run: pnpm -r $FILTER --if-present run test
              env:
                  FILTER: ${{ steps.scope.outputs.filter }}
            # Builds each fixture, jaamd's on Sätteri and unified, and the site.
            - run: pnpm -r $FILTER --if-present run test:build
              env:
                  FILTER: ${{ steps.scope.outputs.filter }}

    # Packs the tarballs and installs them into throwaway projects.
    consumer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:consumer

    # The fixtures and the site pin astro ^7, so the jobs above never see a new
    # major. Red here means the next Astro major needs checking.
    astro-latest:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter jaamd-fixture --filter jaad-fixture --filter site --filter docs add astro@latest
            - run: pnpm test:build
