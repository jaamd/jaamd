name: CI

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    static:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint

    # On a pull request that touches only packages/ and site/, runs the changed
    # projects and their dependents. Anything else runs every project.
    packages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Select projects
              id: scope
              run: |
                  if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
                     ! git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qvE '^(packages|site)/'; then
                    echo "filter=--filter=...[origin/$GITHUB_BASE_REF]" >> "$GITHUB_OUTPUT"
                  fi

            # The filter goes through the environment: a step output never becomes shell source.
            - run: pnpm -r $FILTER --if-present run check
              env:
                  FILTER: ${{ steps.scope.outputs.filter }}
            - run: pnpm -r $FILTER --if-present run test
              env:
                  FILTER: ${{ steps.scope.outputs.filter }}
            # Builds each fixture, jaamd's on Sätteri and unified, and the site.
            - run: pnpm -r $FILTER --if-present run test:build
              env:
                  FILTER: ${{ steps.scope.outputs.filter }}

    # Packs the tarballs and installs them into throwaway projects.
    consumer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:consumer

    # The fixtures and the site pin astro ^7, so the jobs above never see a new
    # major. Red here means the next Astro major needs checking.
    astro-latest:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter jaamd-fixture --filter jaad-fixture --filter site --filter docs add astro@latest
            - run: pnpm test:build
