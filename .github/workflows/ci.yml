name: CI

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint

    # On a pull request that touches only packages/ and site/, runs the changed
    # projects and their dependents. Anything else runs every project.
    packages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Select projects
              id: scope
              run: |
                  if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
                     ! git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qvE '^(packages|site)/'; then
                    echo "filter=--filter=...[origin/$GITHUB_BASE_REF]" >> "$GITHUB_OUTPUT"
                  fi

            - run: pnpm -r ${{ steps.scope.outputs.filter }} --if-present run check
            - run: pnpm -r ${{ steps.scope.outputs.filter }} --if-present run test
            # Builds each fixture, jaamd's on Sätteri and unified, and the site.
            - run: pnpm -r ${{ steps.scope.outputs.filter }} --if-present run test:build

    # Packs the tarballs and installs them into throwaway projects.
    consumer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:consumer

    # The fixtures and the site pin astro ^7, so the jobs above never see a new
    # major. Red here means the next Astro major needs checking.
    astro-latest:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter jaamd-fixture --filter jaad-fixture --filter site --filter docs add astro@latest
            - run: pnpm test:build
