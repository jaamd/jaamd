name: Astro latest

# The fixtures and the sites pin astro ^7, so CI never sees a new major. This
# builds them on the latest Astro once a week: red means the next release needs
# checking before users meet it.
on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter jaamd-fixture --filter jaad-fixture --filter jaab-fixture --filter site --filter docs add astro@latest
            - run: pnpm test:build
