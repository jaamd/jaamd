name: Deploy

# The steps of a deploy, shared by deploy-site.yml and deploy-docs.yml: each
# project is a Worker of its own.
on:
    workflow_call:
        inputs:
            project:
                description: The workspace project to deploy, site or docs.
                type: string
                required: true
            url:
                description: Where it is served.
                type: string
                required: true

permissions:
    contents: read

jobs:
    deploy:
        name: ${{ inputs.project }}
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-${{ inputs.project }}
            cancel-in-progress: false
        # One environment for both: it holds the Cloudflare secrets.
        environment:
            name: production
            url: ${{ inputs.url }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Version comes from "packageManager" in package.json.
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter "$PROJECT" test
              env:
                  PROJECT: ${{ inputs.project }}
            - run: pnpm --filter "$PROJECT" test:build
              env:
                  PROJECT: ${{ inputs.project }}

            - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: ${{ inputs.project }}
                  packageManager: pnpm
                  command: deploy
