name: Deploy jaamd.org

on:
    push:
        branches: [main]
        paths: ['site/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/deploy.yml']
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: production
            url: https://jaamd.org
        steps:
            - uses: actions/checkout@v7

            # Version comes from "packageManager" in package.json.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter site test
            - run: pnpm --filter site test:build

            - uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: site
                  packageManager: pnpm
                  command: deploy
