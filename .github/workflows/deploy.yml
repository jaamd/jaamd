name: Deploy jaamd.org and docs.jaamd.org

on:
    push:
        branches: [main]
        paths: ['site/**', 'docs/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/deploy.yml']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # Each project is a Worker of its own: `site` is jaamd.org, `docs` is docs.jaamd.org.
    deploy:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: site
                      url: https://jaamd.org
                    - project: docs
                      url: https://docs.jaamd.org
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-${{ matrix.project }}
            cancel-in-progress: false
        # One environment for both: it holds the Cloudflare secrets.
        environment:
            name: production
            url: ${{ matrix.url }}
        steps:
            - uses: actions/checkout@v7

            # Version comes from "packageManager" in package.json.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter ${{ matrix.project }} test
            - run: pnpm --filter ${{ matrix.project }} test:build

            - uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: ${{ matrix.project }}
                  packageManager: pnpm
                  command: deploy
