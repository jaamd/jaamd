name: Deploy

on:
    push:
        branches: [main]
        paths: ['site/**', 'docs/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/deploy.yml']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # Each project is a Worker of its own: `site` is jaamd.org, `docs` is docs.jaamd.org.
    deploy:
        # Shown as "Deploy / site" and "Deploy / docs" instead of the whole matrix entry.
        name: ${{ matrix.project }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: site
                      url: https://jaamd.org
                    - project: docs
                      url: https://docs.jaamd.org
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-${{ matrix.project }}
            cancel-in-progress: false
        # One environment for both: it holds the Cloudflare secrets.
        environment:
            name: production
            url: ${{ matrix.url }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Version comes from "packageManager" in package.json.
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter ${{ matrix.project }} test
            - run: pnpm --filter ${{ matrix.project }} test:build

            - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: ${{ matrix.project }}
                  packageManager: pnpm
                  command: deploy
